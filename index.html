<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 к 1 — Главное меню</title>
    <meta name="description" content="Семейная викторина 100 к 1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lobby.css">
</head>
<body class="bg-[#050505] text-white min-h-screen relative">
    <div class="ambient-light bg-blue-600/20 w-[500px] h-[500px] top-0 left-0"></div>
    <div class="ambient-light bg-purple-600/20 w-[400px] h-[400px] bottom-0 right-0" style="animation-delay:-5s"></div>

    <div id="app" v-cloak class="min-h-screen flex flex-col items-center justify-center p-6 z-10 relative">
        <h1 class="text-6xl md:text-7xl font-black text-white mb-3 tracking-widest text-glow uppercase">100 к 1</h1>
        <p class="text-gray-500 mb-8 text-sm tracking-widest uppercase">Семейная викторина</p>

        <div class="flex flex-col space-y-3 w-full max-w-sm mb-8">
            <button @click="openPage('game.html')" class="btn-modern glass-panel w-full py-5 text-lg font-bold rounded-2xl flex items-center justify-center">
                <i class="fas fa-tv mr-4 text-blue-400 text-xl"></i> Табло
            </button>
            <button @click="openPage('host.html')" class="btn-modern glass-panel w-full py-5 text-lg font-bold rounded-2xl flex items-center justify-center">
                <i class="fas fa-microphone mr-4 text-purple-400 text-xl"></i> Панель ведущего
            </button>
            <button @click="openPage('editor.html')" class="btn-modern glass-panel w-full py-5 text-lg font-bold rounded-2xl flex items-center justify-center">
                <i class="fas fa-edit mr-4 text-green-400 text-xl"></i> Редактор вопросов
            </button>
        </div>

        <div class="glass-panel rounded-2xl p-6 max-w-lg w-full text-sm">
            <h3 class="text-white font-semibold mb-3"><i class="fas fa-key mr-2 text-yellow-400"></i> Онлайн-игра</h3>
            <ol class="space-y-2 text-gray-400 text-xs list-decimal list-inside leading-relaxed">
                <li>Ведущий выбирает лобби и получает ключ</li>
                <li>Отправляет ссылку на табло</li>
                <li>Настраивает команды → «Начать игру»</li>
            </ol>
            <p class="text-xs text-gray-600 mt-4">Ключи: см. KEYS.md</p>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/lobby-keys.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
