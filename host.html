<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 к 1 — Панель ведущего</title>
    <script src="js/base-path.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/lobby.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.min.js"></script>
</head>
<body class="page-body">
    <div class="ambient-light bg-purple-600/15 w-[500px] h-[500px] top-0 right-0"></div>

    <div id="app" v-cloak class="page-wrap page-wrap--center">
        <div class="toolbar-row">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Меню</a>
            <button v-if="inLobby" @click="openGame" class="btn-modern bg-blue-600/20 border border-blue-500/30 px-4 py-2 rounded-xl text-sm">
                <i class="fas fa-tv mr-2"></i> Открыть табло
            </button>
        </div>

        <div v-if="!inLobby" class="panel-narrow">
            <lobby-panel role="host"></lobby-panel>
        </div>

        <host-panel v-if="inLobby" class="panel-wide"></host-panel>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/lobby-keys.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components/LobbyPanel.js"></script>
    <script src="js/components/HostPanel.js"></script>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            components: { 'host-panel': HostPanel, 'lobby-panel': LobbyPanel },
            setup() {
                const inLobby = ref(sync.inLobby);
                onMounted(() => {
                    sync.onStatus(() => { inLobby.value = sync.inLobby; });
                    window.addEventListener('sync-status', () => { inLobby.value = sync.inLobby; });
                });
                const openGame = () => {
                    window.open(APP_CONFIG.pageUrl('game.html', { key: sync.lobbyKey || sync.getSavedKey() }), 'GameWindow');
                };
                return { inLobby, openGame };
            }
        }).mount('#app');
    </script>
</body>
</html>
