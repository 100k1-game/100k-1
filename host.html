<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 к 1 — Панель ведущего</title>
    <script src="js/base-path.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lobby.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.min.js"></script>
</head>
<body class="bg-[#050505] text-white min-h-screen relative">
    <div class="ambient-light bg-purple-600/15 w-[500px] h-[500px] top-0 right-0"></div>

    <div id="app" v-cloak class="min-h-screen p-6 z-10 relative flex flex-col items-center">

        <!-- Без ключа — только форма входа -->
        <div v-if="!inLobby" class="min-h-screen flex flex-col items-center justify-center w-full max-w-md">
            <div class="waiting-logo mb-6" style="display:flex;align-items:baseline;gap:0.25rem;font-size:3rem;font-weight:800;">
                <span style="color:#fbbf24;">100</span><span style="color:#fff;">к</span><span style="color:#fbbf24;">1</span>
            </div>
            <p class="text-gray-500 text-sm uppercase tracking-widest mb-6">Панель ведущего</p>
            <lobby-panel role="host"></lobby-panel>
        </div>

        <!-- После входа — полный интерфейс -->
        <template v-else>
            <div class="w-full max-w-6xl mb-4 flex justify-between items-center">
                <a href="index.html" class="text-gray-400 hover:text-white text-sm flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> Меню
                </a>
                <button @click="openGame" class="btn-modern bg-blue-600/20 hover:bg-blue-600/40 border border-blue-500/30 px-4 py-2 rounded-xl text-sm flex items-center">
                    <i class="fas fa-tv mr-2"></i> Открыть табло
                </button>
            </div>
            <host-panel></host-panel>
        </template>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/lobby-keys.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components/LobbyPanel.js"></script>
    <script src="js/components/HostPanel.js"></script>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            components: { 'host-panel': HostPanel, 'lobby-panel': LobbyPanel },
            setup() {
                const inLobby = ref(sync.inLobby);
                const refresh = () => { inLobby.value = sync.inLobby; };
                onMounted(() => {
                    sync.onStatus(refresh);
                    sync.onLobby(refresh);
                    window.addEventListener('sync-status', refresh);
                });
                const openGame = () => {
                    const key = sync.lobbyKey || sync.getSavedKey();
                    window.open(APP_CONFIG.pageUrl('game.html', { key }), 'GameWindow');
                };
                return { inLobby, openGame };
            }
        }).mount('#app');
    </script>
</body>
</html>
