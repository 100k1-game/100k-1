<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 к 1 — Редактор</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <script src="js/base-path.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lobby.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body class="bg-[#050505] text-white min-h-screen relative">
    <div class="ambient-light bg-green-600/15 w-[500px] h-[500px] bottom-0 left-0"></div>

    <div id="app" v-cloak class="min-h-screen p-6 z-10 relative flex flex-col items-center">
        <div class="w-full max-w-6xl mb-6">
            <a href="index.html" class="text-gray-400 hover:text-white text-sm flex items-center">
                <i class="fas fa-arrow-left mr-2"></i> Меню
            </a>
        </div>

        <div v-if="!inLobby" class="w-full max-w-md mb-6">
            <lobby-panel role="editor"></lobby-panel>
        </div>

        <editor-panel v-if="inLobby"></editor-panel>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/lobby-keys.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components/LobbyPanel.js"></script>
    <script src="js/components/EditorPanel.js"></script>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            components: { 'editor-panel': EditorPanel, 'lobby-panel': LobbyPanel },
            setup() {
                const inLobby = ref(sync.inLobby);
                onMounted(() => {
                    sync.onStatus(() => { inLobby.value = sync.inLobby; });
                    window.addEventListener('sync-status', () => { inLobby.value = sync.inLobby; });
                });
                return { inLobby };
            }
        }).mount('#app');
    </script>
</body>
</html>
